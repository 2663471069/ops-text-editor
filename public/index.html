<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>海报文案修改</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>海报文案修改</h1>
      <div class="topbar-right">
        <span id="status-chip" class="chip">检查中…</span>
        <a class="link" href="history.html">修改记录</a>
        <a class="link" href="config.html">设置</a>
      </div>
    </header>

    <main>
      <!-- 第一步：上传 -->
      <section id="stage-upload" class="stage">
        <label id="dropzone" for="file-input">
          <div class="dropzone-inner">
            <div class="dropzone-icon">＋</div>
            <p class="dropzone-title">把海报拖进来、点击选择或直接粘贴</p>
            <p class="dropzone-hint"><kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴截图或复制的图片 · 支持 JPG / PNG / WebP，最大 12MB</p>
          </div>
          <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" hidden />
        </label>
      </section>

      <!-- 第二步：编辑 -->
      <section id="stage-edit" class="stage hidden">
        <div class="workspace">
          <div class="pane pane-image">
            <div class="pane-head">
              <span id="canvas-info" class="muted"></span>
              <div class="image-head-actions">
                <button id="btn-zoom" class="btn btn-ghost btn-sm" type="button">放大查看</button>
                <button id="btn-reset" class="btn btn-ghost btn-sm" type="button">换一张</button>
              </div>
            </div>
            <div id="image-wrap" class="image-wrap">
              <img id="preview" alt="海报预览" data-zoomable="true" />
              <div id="overlay" class="overlay"></div>
            </div>
          </div>

          <div class="pane pane-list">
            <div class="pane-head">
              <span id="list-title">识别到的文字</span>
              <div class="pane-head-status">
                <span id="draft-status" class="muted small">等待编辑</span>
                <span id="edit-count" class="chip chip-quiet">未改动</span>
              </div>
            </div>
            <div class="editor-toolbar">
              <label class="editor-search" for="element-search">
                <span aria-hidden="true">⌕</span>
                <input id="element-search" type="search" placeholder="搜索原文或新文案" autocomplete="off" />
              </label>
              <div id="element-filters" class="filter-group" aria-label="文字筛选">
                <button class="on" type="button" data-filter="all" aria-pressed="true">全部 <span id="filter-all-count">0</span></button>
                <button type="button" data-filter="edited" aria-pressed="false">已修改 <span id="filter-edited-count">0</span></button>
                <button type="button" data-filter="unedited" aria-pressed="false">未修改 <span id="filter-unedited-count">0</span></button>
              </div>
              <div class="batch-tools">
                <select id="batch-font" title="批量设置已修改文案的公司字体">
                  <option value="">批量字体：自动保留原样</option>
                </select>
                <button id="btn-apply-font" class="btn btn-ghost btn-sm" type="button" disabled>应用到已修改项</button>
              </div>
            </div>
            <div id="element-list" class="element-list"></div>
            <div id="element-empty" class="element-empty hidden">
              <strong>没有符合条件的文案</strong>
              <span>尝试清除搜索或切换筛选条件</span>
            </div>
            <details id="change-log" class="change-log hidden" open>
              <summary>本次修改记录 <span id="change-log-count" class="chip chip-ok">0</span></summary>
              <div id="change-log-list" class="change-log-list"></div>
            </details>
            <div class="pane-foot">
              <div class="generation-summary">
                <strong id="generation-summary">尚未修改文案</strong>
                <span id="generation-meta" class="muted small">正在读取出图方式…</span>
              </div>
              <button id="btn-generate" class="btn btn-primary" type="button" disabled>生成修改后的图</button>
              <p id="generate-hint" class="muted small">输入新文案；输入“消除”可清除对应识别框</p>
            </div>
          </div>
        </div>
      </section>

      <!-- 第三步：结果 -->
      <section id="stage-result" class="stage hidden">
        <div class="result-head">
          <h2 id="result-title">正在生成…</h2>
          <div class="result-actions">
            <button id="btn-cancel" class="btn btn-danger hidden" type="button">取消生成</button>
            <a id="btn-download" class="btn btn-primary hidden" download="poster-edited.jpg">下载</a>
            <button id="btn-next" class="btn btn-primary hidden" type="button">修改下一张</button>
            <button id="btn-back" class="btn btn-ghost" type="button">返回继续改</button>
          </div>
        </div>
        <div id="result-body" class="result-body">
          <div class="spinner"></div>
          <p id="result-note" class="muted">提交中…</p>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>
    <script src="image-viewer.js"></script>
    <script src="app.js"></script>
  </body>
</html>
