<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置 · 海报文案修改</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>设置</h1>
      <div class="topbar-right"><a class="link" href="index.html">← 回到编辑</a></div>
    </header>

    <main>
      <div class="config-wrap">
        <!-- 文字识别 -->
        <section class="card">
          <h2>文字识别（OCR）</h2>
          <div class="card-body">
            <div class="field">
              <label for="ocr-provider">服务商</label>
              <select id="ocr-provider">
                <option value="codex">Codex 视觉识别（无需 OCR API Key，推荐本机使用）</option>
                <option value="mock">假数据（不调用外部服务，仅用于试用界面）</option>
                <option value="tencent">腾讯云 OCR</option>
                <option value="baidu">百度智能云 OCR</option>
                <option value="aliyun">阿里云 OCR</option>
              </select>
            </div>

            <div id="ocr-credentials">
              <div class="field">
                <label for="ocr-secret-id"><span class="js-id-label">SecretId</span></label>
                <input id="ocr-secret-id" type="text" autocomplete="off" spellcheck="false" />
                <p class="field-hint">留空 = 保持原值不变</p>
              </div>
              <div class="field">
                <label for="ocr-secret-key"><span class="js-key-label">SecretKey</span></label>
                <input id="ocr-secret-key" type="password" autocomplete="off" spellcheck="false" />
              </div>
              <div class="field" id="ocr-region-field">
                <label for="ocr-region">地域</label>
                <input id="ocr-region" type="text" placeholder="ap-guangzhou" />
              </div>
            </div>

            <div class="field">
              <label for="ocr-min-area">最小文字区域（占整幅面积的百分比，%）</label>
              <input id="ocr-min-area" type="number" step="0.01" min="0" max="100" />
              <p class="field-hint">调小能识别到更细碎的文字，也更容易识别出噪点。默认 0.05</p>
            </div>
          </div>
          <div class="card-foot">
            <button id="btn-save-ocr" class="btn btn-primary" type="button">保存</button>
            <button id="btn-test-ocr" class="btn btn-ghost" type="button">测试连接</button>
          </div>
          <div id="test-output" class="test-output hidden"></div>
        </section>

        <!-- 出图 -->
        <section class="card">
          <h2>出图方式</h2>
          <div class="card-body">
            <label class="radio-row" id="row-local">
              <input type="radio" name="image-provider" value="local" />
              <span>
                <span class="rr-title">本地合成 —— 不需要密钥，现在就能用</span>
                <span class="rr-desc">
                  在原图上把旧文字盖掉、重画新文字。纯色背景效果好；文字压在照片、渐变、纹理上会留痕。
                </span>
              </span>
            </label>

            <label class="radio-row" id="row-codex">
              <input type="radio" name="image-provider" value="codex" />
              <span>
                <span class="rr-title">Codex 生图 —— 无需单独 API Key，推荐本机使用</span>
                <span class="rr-desc">
                  复用当前电脑的 Codex 登录态和内置生图能力。效果适合复杂背景，通常需要 2–5 分钟，并消耗 Codex 使用额度。
                </span>
              </span>
            </label>

            <label class="radio-row" id="row-openai">
              <input type="radio" name="image-provider" value="openai" />
              <span>
                <span class="rr-title">AI 重新生成 —— 需要图像编辑 API 密钥</span>
                <span class="rr-desc">任意背景都能自然重绘，效果最好，按次计费。</span>
              </span>
            </label>

            <div id="openai-fields" class="hidden" style="margin-top: 14px">
              <div class="field">
                <label for="image-base-url">API 地址</label>
                <input id="image-base-url" type="text" placeholder="https://api.example.com/v1" />
                <p class="field-hint">填到 /v1 为止，程序会自动拼 /images/edits</p>
              </div>
              <div class="field">
                <label for="image-model">模型名</label>
                <input id="image-model" type="text" placeholder="gpt-image-1" />
              </div>
              <div class="field">
                <label for="image-api-key">API Key</label>
                <input id="image-api-key" type="password" autocomplete="off" spellcheck="false" />
                <p class="field-hint">留空 = 保持原值不变。只存在服务端，界面上只显示后 4 位</p>
              </div>
              <div class="field">
                <label for="image-endpoint-mode">调用方式</label>
                <select id="image-endpoint-mode">
                  <option value="edits">/images/edits（带原图，推荐）</option>
                  <option value="generations">/images/generations（纯文本，供应商要求时才选）</option>
                </select>
              </div>
            </div>
          </div>
          <div class="card-foot">
            <button id="btn-save-image" class="btn btn-primary" type="button">保存</button>
          </div>
        </section>

        <!-- 提示词模板 -->
        <section class="card">
          <h2>提示词模板</h2>
          <div class="card-body">
            <div class="field">
              <label for="prompt-template">
                模板内容（必须保留 <code>{{canvasSize}}</code>、<code>{{changeCount}}</code>、<code>{{changes}}</code>）
              </label>
              <textarea id="prompt-template" spellcheck="false"></textarea>
              <p class="field-hint">影响 Codex / API 出图；本地合成不使用提示词。清空后保存 = 恢复默认模板</p>
            </div>
          </div>
          <div class="card-foot">
            <button id="btn-save-prompt" class="btn btn-primary" type="button">保存</button>
            <button id="btn-reset-prompt" class="btn btn-ghost" type="button">恢复默认</button>
          </div>
        </section>

        <!-- 并发 -->
        <section class="card">
          <h2>并发限制</h2>
          <div class="card-body">
            <div class="field">
              <label for="limit-per-user">单用户同时进行的任务数</label>
              <input id="limit-per-user" type="number" min="1" max="20" />
            </div>
            <div class="field">
              <label for="limit-global">全局同时进行的任务数</label>
              <input id="limit-global" type="number" min="1" max="100" />
              <p class="field-hint">改完需重启服务才生效</p>
            </div>
          </div>
          <div class="card-foot">
            <button id="btn-save-limits" class="btn btn-primary" type="button">保存</button>
          </div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast hidden"></div>
    <script src="config.js"></script>
  </body>
</html>
