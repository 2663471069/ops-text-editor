<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生成记录 · 海报文案修改</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>生成记录</h1>
      <div class="topbar-right">
        <a class="link" href="index.html">返回编辑</a>
        <a class="link" href="config.html">设置</a>
      </div>
    </header>

    <main class="history-main">
      <div class="history-heading">
        <div>
          <h2>最近生成</h2>
          <p id="history-retention" class="muted small">记录保存在这台电脑上</p>
        </div>
        <button id="btn-refresh-history" class="btn btn-ghost" type="button">刷新</button>
      </div>
      <section id="history-content" aria-live="polite">
        <div class="history-empty"><div class="spinner"></div><p class="muted">读取记录中…</p></div>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>
    <script src="image-viewer.js"></script>
    <script src="history.js"></script>
  </body>
</html>
